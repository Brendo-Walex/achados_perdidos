<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teste de API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .success { border-color: green; background: #e8f5e9; }
        .error { border-color: red; background: #ffebee; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Teste de Listagem de Itens</h1>
    
    <div class="test">
        <h2>1. Teste direto da API</h2>
        <button onclick="testarAPI()">Testar API</button>
        <div id="resultado"></div>
    </div>

    <div class="test">
        <h2>2. Teste com diferentes filtros</h2>
        <button onclick="testarAPI('todos')">Todos</button>
        <button onclick="testarAPI('Achado')">Achados</button>
        <button onclick="testarAPI('Perdido')">Perdidos</button>
        <div id="resultado2"></div>
    </div>

    <script>
        async function testarAPI(situacao = 'todos') {
            const resultado = document.getElementById(situacao === 'todos' ? 'resultado' : 'resultado2');
            resultado.innerHTML = '<p>Carregando...</p>';
            
            try {
                const url = `listar_itens.php?situacao=${encodeURIComponent(situacao)}`;
                console.log('Acessando URL:', url);
                
                const response = await fetch(url);
                console.log('Status HTTP:', response.status);
                
                const text = await response.text();
                console.log('Resposta bruta:', text);
                
                const data = JSON.parse(text);
                console.log('JSON parseado:', data);
                
                let html = `<p class="success"><strong>Sucesso!</strong></p>`;
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                html += `<p>Total de itens: ${data.total}</p>`;
                
                if (data.itens && data.itens.length > 0) {
                    html += '<h3>Itens:</h3><ul>';
                    data.itens.forEach(item => {
                        html += `<li><strong>${item.nome}</strong> - ${item.situacao}</li>`;
                    });
                    html += '</ul>';
                }
                
                resultado.innerHTML = html;
            } catch (error) {
                console.error('Erro:', error);
                resultado.innerHTML = `<p class="error"><strong>Erro:</strong> ${error.message}</p><pre>${error.stack}</pre>`;
            }
        }
    </script>
</body>
</html>
