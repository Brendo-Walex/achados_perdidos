<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Item</title>
  <link rel="stylesheet" href="css/css-reset.css">
  <link rel="stylesheet" href="css/cadastro_item.css"/>
  <link rel="stylesheet" href="js/cadastro_item.js">
</head>
<body>
  <header>
 <img src="img/logo.png" alt="logo">
    <div>
    <h1>Achou?achei.com</h1>
    <br>
    <p class="tagline">"Porque perder algo é fácil, mas recuperar também pode ser"</p>
    </div>
    <nav>
        <button onclick="irParateladelistasitens()">☰ Lista Itens</button>
        <button onclick="irParateladesolicitacoes()">👁 Ver Solicitações</button>
        <button onclick="irParateladedevolucao()">↩ Ver Devolução</button>

    </nav>
  </header>

  <main>
    <form class="formulario" action="cadastrar_item.php" method="post" enctype="multipart/form-data">
      <div class="campo">
        <label for="nome">Nome do Item</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do item" required />
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="3"></textarea>
      </div>

      <div class="imagem-cor">
        <div class="campo">
          <label for="imagem">Foto do Item</label>
          <input type="file" id="imagem" name="imagem" accept="image/*" />
        </div>

        <div class="campo">
          <label for="cor">Cor Predominante</label>
          <select id="cor" name="cor">
            <option>Preto</option>
            <option>Vermelho</option>
            <option>Azul</option>
            <option>Branco</option>
            <option>Cinza</option>
            <option>Outra</option>
          </select>
        </div>

        <div class="campo"> 
          <label for="situacao">Situação do item</label>
          <select id="situacao" name="situacao">
            <option>Achado</option>
            <option>Perdido</option>
          </select>
        </div>
      </div>

      <div class="imagem-preview">
        <img src="img/mochila_preta.webp" alt="Prévia da imagem" />
      </div>

      <div class="campo-duplo">
        <div class="campo">
          <label for="data">Data</label>
          <input type="date" id="data" name="data" />
        </div>
        <div class="campo">
          <label for="hora">Horário (aproximadamente)</label>
          <input type="time" id="hora" name="hora" />
        </div>
      </div>

      <div class="campo">
        <label for="pergunta">Faça uma pergunta específica para o item (opcional)</label>
        <input type="text" id="pergunta" name="pergunta" placeholder="Ex: Qual o papel de parede do telefone?" />
      </div>

      <div class="campo">
        <label for="achador">Nome de quem achou</label>
        <input type="text" id="achador" name="achador" />
      </div>

      <div class="botoes">
        <button type="submit" class="Cadastrar">salvar</button>
      </div>
    </form>
  </main> 
   <script>
    function irParateladelistasitens() {
    window.location.href = "tela_listagem_de_itens.html";
  }
   function irParateladesolicitacoes() {
    window.location.href = "tela_solicitacoes.html";
  }
   function irParateladedevolucao() {
    window.location.href = "tela_devolucao.html";
  }
  </script>
</body>
</html>
