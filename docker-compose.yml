version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: achou_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: achados_e_perdidos
    volumes:
      - dbdata:/var/lib/mysql
      # O comando abaixo carrega seu SQL automaticamente na criação do container
      - ./bd:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: achou_php_app
    ports:
      - "8080:80"
    volumes:
      # Mapeia a raiz do projeto para acessar tanto /app quanto /public
      - ./:/var/www/html:cached
    depends_on:
      - db

volumes:
  dbdata: